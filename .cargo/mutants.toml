# cargo-mutants house config (testing-strategy §3.C: missed=0 gate over the
# kernel crates; the weekly leg is `just deep-mutants`).
#
# This file is the test-suite exemption surface (testing-strategy §4.2, gate
# surface): every exclusion carries its reason inline. (`#[mutants::skip]`
# attributes are unusable here — the attribute needs the nightly-only
# `register_tool` feature and the house toolchain is stable — so exemptions
# live in this one auditable file.)
# Anchored (\\b) so a future `verify_proofs::` module or a
# `SlabArena::with_capacity` does NOT silently inherit the exemption —
# broadening this list must take the gate-surface path, not drift.
exclude_re = [
    # cfg(kani) proof modules (`mod proofs` in metis-fiber-core): their oracle
    # is the Kani verifier (weekly `just deep-kani` leg), not the test suite —
    # proof code never compiles into a nextest build, so every mutant there is
    # missed by construction.
    "\\bproofs::",
    # Arena::with_capacity's capacity reservation is a performance hint,
    # unobservable through the public API — no test can kill its mutants.
    "\\bArena::with_capacity\\b",
]
