# cargo-deny dependency policy: advisories / licenses / bans / sources (`just deny`).
# Docs: https://embarkstudios.github.io/cargo-deny/
[advisories]
yanked = "deny"
# Every ignore is temporary and carries its removal trigger in a comment; the
# fuse is `just deny`'s `-D advisory-not-detected`, which fails CI once the
# advisory no longer matches any crate in the tree — the dependency-update PR
# that clears the condition is the one that must delete the entry.
ignore = []

[bans]
# Warn on multiple major versions of the same dependency — common while the
# tree evolves, but must be explicitly acknowledged in review
multiple-versions = "warn"
highlight = "all"
# Pinned duplicate acceptance (2026-10-15, backlog Q10): each entry is one
# half of a duplicate pair we cannot converge ourselves; the comment names
# the upstream trigger that resolves it. The fuse is `just deny`'s
# `-D unmatched-skip`: when the pinned version leaves the tree CI fails,
# forcing the entry to be deleted (duplicate gone) or re-pinned (duplicate
# moved to a newer version) in the same change. The stream stays
# silent-green — a new duplicate warning is signal, not noise floor.
skip = [
    # syn 2.x comes from miette-derive (tracing-attributes left the tree
    # with the unused tracing dep, 2026-10-15), 3.x from clap_derive /
    # thiserror-impl / the synstructure chain. Proc-macro-only
    # duplicate: compile-time cost, no runtime surface.
    # Trigger: miette bumps its derive stack onto syn 3.
    { name = "syn", version = "=2.0.119" },
    # miette 7.6.0 depends on unicode-width 0.1 directly while its textwrap
    # 0.16 dependency uses 0.2 — the pair converges only upstream.
    # Trigger: a miette release aligning its direct dep with textwrap's.
    { name = "unicode-width", version = "=0.1.14" },
]

[licenses]
# A new dependency's license must already be on this list; extending the list
# requires a discussion in the PR first. Prefer a per-crate exception below
# over widening this global list.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "0BSD",
]
# Per-crate exceptions: the license is allowed ONLY for the named crate, so a
# new crate arriving under the same license still trips the gate. The fuse is
# `just deny`'s `-D license-exception-not-encountered`: when the named crate
# leaves the dependency tree, CI fails and the entry must be deleted in that
# same PR.
exceptions = [
    # slotmap (fiber arena generational keys, ADR-0010) is Zlib-licensed —
    # allowed for this crate only; widening the global allow-list would
    # silently admit every future Zlib crate. Ratified in the T10.2 opening
    # batch (issue 1a). Removal trigger: slotmap leaves the dependency tree.
    { name = "slotmap", allow = ["Zlib"] },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
