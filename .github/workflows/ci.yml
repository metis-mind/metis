# Thin CI orchestration layer: triggers / matrix / permissions / caches only.
# All logic lives in the justfile — reproduce any CI failure locally with
#   nix develop -c just ci        (consuming the same rust-toolchain.toml / Cargo.lock)
# Native Windows is not a CI target: Windows hosts are supported via WSL2
# (ADR-0030). Third-party actions are pinned to full commit SHAs; dependabot
# keeps them fresh.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs the same .pre-commit-config.yaml as local git hooks; CI only changes
  # the file scope (all files, read-only)
  quality-gate:
    name: quality gate (prek)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      # zero-config binary cache; for stricter requirements switch to FlakeHub
      # Cache or Cachix
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          # otherwise the action probes FlakeHub Cache (the paid hosted sibling)
          # whenever determinate-nixd is present, erroring noisily before
          # falling back to the free GitHub Actions cache
          use-flakehub: false
      # cargo registry + target/ cache. Not rust-cache: its key detection shells
      # out through `nix develop -c` (~75s of flake eval per job); a static key
      # over the lockfile + toolchain pin expresses the same identity instantly.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v0-rust-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c prek run --all-files --show-diff-on-failure

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14
        with:
          use-flakehub: false # see the quality-gate job
      # cargo registry + target/ cache; actions/cache over rust-cache for the
      # same reason as the quality-gate job (no `nix develop -c` detection tax)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: v0-rust-${{ github.job }}-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: v0-rust-${{ github.job }}-${{ runner.os }}-
      - run: nix develop -c just ci
